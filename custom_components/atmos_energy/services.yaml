populate_past_usage:
  name: Populate Past Usage
  description: Import historical daily gas usage data from an Atmos Energy XLS spreadsheet. Note that this is specifically for DAILY usage spreadsheets, not monthly.
  fields:
    file_path:
      name: File Path
      description: The path to the Atmos Energy XLS file (e.g., /config/dailyUsage.xls).
      required: true
      example: /config/dailyUsage.xls
      selector:
        text:
    config_entry:
      name: Account
      description: The Atmos Energy entry to import into. Required when more than one account is set up.
      required: false
      selector:
        config_entry:
          integration: atmos_energy

refresh_current_usage:
  name: Refresh Current Usage
  description: Manually trigger a refresh of the current usage and billing data from the Atmos Energy portal, for every configured account.
